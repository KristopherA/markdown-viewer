name: MarkdownViewer
options:
  bundleIdPrefix: com.markdownviewer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  ENABLE_HARDENED_RUNTIME: "NO"
packages:
  MarkdownRendering:
    path: MarkdownRendering
targets:
  MarkdownViewer:
    type: application
    platform: macOS
    sources:
      - path: MarkdownViewer
        excludes:
          - Info.plist
    dependencies:
      - package: MarkdownRendering
      - target: MarkdownViewerQL
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.markdownviewer.MarkdownViewer
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: MarkdownViewer/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: Markdown Viewer
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
  MarkdownViewerQL:
    type: app-extension
    platform: macOS
    sources:
      - path: MarkdownViewerQL
        excludes:
          - Info.plist
          - MarkdownViewerQL.entitlements
    dependencies:
      - package: MarkdownRendering
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.markdownviewer.MarkdownViewer.QuickLook
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: MarkdownViewerQL/Info.plist
      CODE_SIGN_ENTITLEMENTS: MarkdownViewerQL/MarkdownViewerQL.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
      SKIP_INSTALL: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
schemes:
  MarkdownViewer:
    build:
      targets:
        MarkdownViewer: all
        MarkdownViewerQL: all
    run:
      config: Debug
